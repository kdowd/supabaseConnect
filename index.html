<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Titanic Passenger Manifest · Supabase</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --ink: #131a2b;
    --ink-soft: #5b6780;
    --ink-faint: #8b95a8;
    --line: #e3e8f0;
    --line-strong: #cdd5e2;
    --brand: #2f6fed;
    --brand-soft: #eaf1fe;
    --good: #0f8a5f;
    --good-soft: #e3f6ee;
    --bad: #b8384a;
    --bad-soft: #fdeaed;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(19, 26, 43, .06), 0 8px 24px -12px rgba(19, 26, 43, .18);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e131d;
      --panel: #161d2b;
      --ink: #e8ecf4;
      --ink-soft: #a3aec2;
      --ink-faint: #78839a;
      --line: #232c3e;
      --line-strong: #313c52;
      --brand: #6d9bff;
      --brand-soft: #1b2740;
      --good: #45c894;
      --good-soft: #142c26;
      --bad: #ef7c8c;
      --bad-soft: #2e1a1f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .6);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px 64px; }

  /* ---------- header ---------- */
  header.top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: -.02em;
    font-weight: 650;
  }

  .sub {
    margin: 5px 0 0;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  .sub code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    background: var(--brand-soft);
    color: var(--brand);
    padding: 1px 6px;
    border-radius: 5px;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-faint);
    flex: none;
  }
  .dot.live   { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
  .dot.err    { background: var(--bad);  box-shadow: 0 0 0 3px var(--bad-soft); }
  .dot.load   { background: var(--brand); animation: pulse 1.1s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .25; }
  }

  /* ---------- stats ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }

  .stat .k {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .stat .v {
    font-size: 25px;
    font-weight: 650;
    letter-spacing: -.02em;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .stat .v.good { color: var(--good); }
  .stat .v.bad  { color: var(--bad); }

  /* ---------- controls ---------- */
  .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
  }

  .field { display: flex; flex-direction: column; gap: 4px; }

  .field label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding-left: 2px;
  }

  input[type="search"], select {
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    padding: 8px 11px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  /* Explicit widths stop a select from stretching to its longest option
     (e.g. "engineering crew"), which otherwise breaks the single-row layout. */
  select { width: 132px; }
  #fClass { width: 166px; }
  #fCountry { width: 154px; }

  .btnrow { display: flex; gap: 8px; }

  /* NOTE: .field is a column flex container, so the input must size with
     width/height rather than a flex-basis (which would become its height). */
  input[type="search"] { width: 100%; min-width: 170px; }

  input[type="search"]:focus, select:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
  }

  select { cursor: pointer; appearance: none; padding-right: 30px;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%),
                      linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
    background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  button {
    font: inherit;
    font-size: 14px;
    font-weight: 550;
    border-radius: 9px;
    padding: 9px 15px;
    cursor: pointer;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    color: var(--ink);
    transition: background .15s, border-color .15s, color .15s;
  }

  button:hover:not(:disabled) { background: var(--bg); border-color: var(--brand); color: var(--brand); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }

  .spacer { flex: 1 1 auto; }

  /* ---------- table ---------- */
  .table-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .table-scroll { overflow: auto; max-height: 62vh; }

  table { border-collapse: collapse; width: 100%; font-size: 14px; }

  thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--panel);
    border-bottom: 1px solid var(--line-strong);
    text-align: left;
    font-size: 11.5px;
    font-weight: 650;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 0;
    white-space: nowrap;
  }

  thead th button {
    all: unset;
    display: flex;
    align-items: center;
    gap: 5px;
    width: 100%;
    padding: 11px 13px;
    cursor: pointer;
    border-radius: 0;
    color: inherit;
    font: inherit;
  }

  thead th button:hover { color: var(--brand); background: var(--brand-soft); }
  thead th .arrow { opacity: 0; font-size: 10px; transition: opacity .15s; }
  thead th[aria-sort] .arrow { opacity: 1; color: var(--brand); }

  tbody td {
    padding: 9px 13px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 300px;
  }

  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--brand-soft); }

  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num button { justify-content: flex-end; }
  td.name { font-weight: 500; max-width: 340px; }
  td.muted { color: var(--ink-faint); }

  .pill {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 650;
    letter-spacing: .03em;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid transparent;
  }

  .pill.yes { background: var(--good-soft); color: var(--good); border-color: var(--good); }
  .pill.no  { background: var(--bad-soft);  color: var(--bad);  border-color: var(--bad); }

  /* ---------- pager / footer ---------- */
  .pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    padding: 11px 14px;
    border-top: 1px solid var(--line);
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .pager .group { display: flex; align-items: center; gap: 8px; }
  .pager .page { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- states ---------- */
  .state {
    padding: 56px 24px;
    text-align: center;
    color: var(--ink-soft);
  }

  .state h2 { margin: 0 0 6px; font-size: 17px; color: var(--ink); font-weight: 620; }
  .state p  { margin: 0 auto; max-width: 560px; font-size: 14px; }

  .state pre {
    text-align: left;
    display: inline-block;
    margin: 14px auto 0;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 12px 14px;
    font-size: 12.5px;
    max-width: 100%;
    overflow: auto;
  }

  .bar {
    height: 4px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin: 16px auto 0;
    max-width: 320px;
  }

  .bar > i {
    display: block;
    height: 100%;
    width: 35%;
    background: var(--brand);
    border-radius: 999px;
    animation: slide 1.15s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(340%); }
  }

  .empty { padding: 52px 24px; text-align: center; color: var(--ink-soft); }
  .empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Titanic Passenger Manifest</h1>
      <p class="sub">
        Live data from Supabase table <code>public.titanic</code> ·
        project <code>pkpbzthkwskkudqogyrl</code>
      </p>
    </div>
    <div class="status" id="status">
      <span class="dot load" id="statusDot"></span>
      <span id="statusText">Connecting…</span>
    </div>
  </header>

  <section class="stats" id="stats" hidden>
    <div class="stat"><div class="k">Rows shown</div><div class="v" id="statRows">–</div></div>
    <div class="stat"><div class="k">Survived</div><div class="v good" id="statSurvived">–</div></div>
    <div class="stat"><div class="k">Died</div><div class="v bad" id="statDied">–</div></div>
    <div class="stat"><div class="k">Survival rate</div><div class="v" id="statRate">–</div></div>
    <div class="stat"><div class="k">Avg. age</div><div class="v" id="statAge">–</div></div>
    <div class="stat"><div class="k">Avg. fare</div><div class="v" id="statFare">–</div></div>
  </section>

  <section class="controls" id="controls" hidden>
    <div class="field" style="flex:1 1 200px">
      <label for="q">Search</label>
      <input type="search" id="q" placeholder="Passenger name or country…" autocomplete="off" spellcheck="false" />
    </div>
    <div class="field">
      <label for="fClass">Class</label>
      <select id="fClass"><option value="">All</option></select>
    </div>
    <div class="field">
      <label for="fGender">Gender</label>
      <select id="fGender"><option value="">All</option></select>
    </div>
    <div class="field">
      <label for="fSurvived">Survived</label>
      <select id="fSurvived"><option value="">All</option></select>
    </div>
    <div class="field">
      <label for="fEmbarked">Embarked</label>
      <select id="fEmbarked"><option value="">All</option></select>
    </div>
    <div class="field">
      <label for="fCountry">Country</label>
      <select id="fCountry"><option value="">All</option></select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="btnrow">
        <button id="reset" type="button">Reset</button>
        <button id="reload" type="button" class="primary">Reload</button>
      </div>
    </div>
  </section>

  <section class="table-card">
    <div id="stateBox" class="state">
      <h2>Loading passenger records…</h2>
      <p>Fetching rows from the Supabase REST API.</p>
      <div class="bar"><i></i></div>
    </div>

    <div id="tableBox" hidden>
      <div class="table-scroll">
        <table>
          <thead><tr id="headRow"></tr></thead>
          <tbody id="body"></tbody>
        </table>
      </div>
      <div class="pager">
        <span class="page" id="pageInfo">–</span>
        <div class="group">
          <button id="first" type="button" title="First page">« First</button>
          <button id="prev"  type="button" title="Previous page">‹ Prev</button>
          <span class="page" id="pageNum">–</span>
          <button id="next"  type="button" title="Next page">Next ›</button>
          <button id="last"  type="button" title="Last page">Last »</button>
        </div>
      </div>
    </div>
  </section>

</div>

<script>
(function () {
  "use strict";

  /* ======================= configuration ======================= */

  const SUPABASE_URL = "https://pkpbzthkwskkudqogyrl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_MOHaPhKPaA_4Gb7ZMgxQgg_I4YNNk_w";
  const TABLE        = "titanic";
  const CHUNK        = 1000;  // Supabase REST returns max 1000 rows per request
  const PAGE_SIZE    = 50;    // rows rendered per page

  const COLUMNS = [
    { key: "id",       label: "#",        type: "number", align: "num"  },
    { key: "name",     label: "Name",     type: "text",   align: "name" },
    { key: "gender",   label: "Gender",   type: "text"   },
    { key: "age",      label: "Age",      type: "number", align: "num"  },
    { key: "class",    label: "Class",    type: "text"   },
    { key: "embarked", label: "Embarked", type: "text"   },
    { key: "country",  label: "Country",  type: "text"   },
    { key: "fare",     label: "Fare",     type: "number", align: "num"  },
    { key: "survived", label: "Survived", type: "text"   }
  ];

  /* =========================== helpers ========================= */

  const $ = (id) => document.getElementById(id);

  const esc = (v) => String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  /** Parse "42", "7.11", "" -> number, or NaN when unusable. */
  function num(v) {
    if (v == null) return NaN;
    if (typeof v === "number") return v;
    const s = String(v).trim();
    if (!s || s.toUpperCase() === "NA" || s.toUpperCase() === "N/A") return NaN;
    const n = parseFloat(s.replace(/[^0-9.eE+-]/g, ""));
    return Number.isFinite(n) ? n : NaN;
  }

  const fmtInt = (n) => Number.isFinite(n) ? n.toLocaleString() : "–";
  const fmt1   = (n) => Number.isFinite(n) ? n.toFixed(1) : "–";

  function setStatus(text, kind) {
    $("statusText").textContent = text;
    $("statusDot").className = "dot" + (kind ? " " + kind : "");
  }

  /* ============================ state ========================== */

  const state = {
    rows: [],
    view: [],
    sortKey: "id",
    sortDir: "asc",
    page: 1,
    filters: { q: "", class: "", gender: "", survived: "", embarked: "", country: "" }
  };

  /* ========================== data load ======================== */

  let client = null;

  async function loadAllRows(onProgress) {
    if (!client) {
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false }
      });
    }

    const all = [];
    let from = 0;

    for (;;) {
      const to = from + CHUNK - 1;
      const { data, error } = await client
        .from(TABLE)
        .select("*")
        .order("id", { ascending: true })
        .range(from, to);

      if (error) {
        const err = new Error(error.message || "Supabase request failed");
        err.details = error.details;
        err.hint = error.hint;
        err.code = error.code;
        throw err;
      }

      if (!data || data.length === 0) break;

      all.push(...data);
      if (onProgress) onProgress(all.length);

      if (data.length < CHUNK) break;
      from += CHUNK;

      if (from > 500000) break; // hard safety stop
    }

    return all;
  }

  /* ======================== filter + sort ====================== */

  function applyFilters() {
    const f = state.filters;
    const q = f.q.trim().toLowerCase();

    state.view = state.rows.filter((r) => {
      if (f["class"]    && String(r["class"])    !== f["class"])    return false;
      if (f.gender      && String(r.gender)      !== f.gender)      return false;
      if (f.survived    && String(r.survived)    !== f.survived)    return false;
      if (f.embarked    && String(r.embarked ?? "") !== f.embarked) return false;
      if (f.country     && String(r.country)     !== f.country)     return false;

      if (q) {
        const hay = (String(r.name ?? "") + " " + String(r.country ?? "")).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    applySort();
  }

  function applySort() {
    const key  = state.sortKey;
    const dir  = state.sortDir === "asc" ? 1 : -1;
    const col  = COLUMNS.find((c) => c.key === key) || { type: "text" };
    const numeric = col.type === "number";

    state.view.sort((a, b) => {
      if (numeric) {
        const x = num(a[key]), y = num(b[key]);
        const xOk = !Number.isNaN(x), yOk = !Number.isNaN(y);
        if (!xOk && !yOk) return 0;
        if (!xOk) return 1;   // blanks always sink to the bottom
        if (!yOk) return -1;
        return (x - y) * dir;
      }
      const x = String(a[key] ?? "").toLowerCase();
      const y = String(b[key] ?? "").toLowerCase();
      return x.localeCompare(y) * dir;
    });
  }

  /* ========================== rendering ======================== */

  function renderHead() {
    $("headRow").innerHTML = COLUMNS.map((c) => {
      const active = state.sortKey === c.key;
      const sortAttr = active ? ` aria-sort="${state.sortDir === "asc" ? "ascending" : "descending"}"` : "";
      const arrow = active ? (state.sortDir === "asc" ? "▲" : "▼") : "▲";
      return `<th class="${c.align === "num" ? "num" : ""}"${sortAttr}>` +
             `<button type="button" data-sort="${c.key}">${esc(c.label)}` +
             `<span class="arrow">${arrow}</span></button></th>`;
    }).join("");
  }

  function renderStats() {
    const rows = state.view;
    let survived = 0, dead = 0, ageSum = 0, ageN = 0, fareSum = 0, fareN = 0;

    for (const r of rows) {
      const s = String(r.survived ?? "").toLowerCase();
      if (s === "yes" || s === "1" || s === "true") survived++;
      else if (s === "no" || s === "0" || s === "false") dead++;

      const a = num(r.age);
      if (!Number.isNaN(a)) { ageSum += a; ageN++; }
      const fv = num(r.fare);
      if (!Number.isNaN(fv)) { fareSum += fv; fareN++; }
    }

    const total = survived + dead;
    $("statRows").textContent     = fmtInt(rows.length);
    $("statSurvived").textContent = fmtInt(survived);
    $("statDied").textContent     = fmtInt(dead);
    $("statRate").textContent     = total ? (survived / total * 100).toFixed(1) + "%" : "–";
    $("statAge").textContent      = ageN ? fmt1(ageSum / ageN) : "–";
    $("statFare").textContent     = fareN ? fmt1(fareSum / fareN) : "–";
  }

  function cellHTML(col, row) {
    const raw = row[col.key];

    if (col.key === "survived") {
      const s = String(raw ?? "").toLowerCase();
      const isYes = s === "yes" || s === "1" || s === "true";
      const isNo  = s === "no"  || s === "0" || s === "false";
      if (!isYes && !isNo) return `<span class="muted">–</span>`;
      return `<span class="pill ${isYes ? "yes" : "no"}">${isYes ? "Yes" : "No"}</span>`;
    }

    if (col.type === "number") {
      const n = num(raw);
      if (Number.isNaN(n)) return `<span class="muted">–</span>`;
      return esc(col.key === "fare" ? n.toFixed(2) : n);
    }

    if (raw == null || raw === "") return `<span class="muted">–</span>`;
    return esc(raw);
  }

  function renderTable() {
    const total = state.view.length;
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));

    if (state.page > pages) state.page = pages;
    if (state.page < 1) state.page = 1;

    const start = (state.page - 1) * PAGE_SIZE;
    const slice = state.view.slice(start, start + PAGE_SIZE);
    const body  = $("body");

    if (!slice.length) {
      body.innerHTML = "";
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="${COLUMNS.length}">
        <div class="empty"><strong>No matching passengers</strong>
        Try clearing the search box or resetting the filters.</div></td>`;
      body.appendChild(tr);
    } else {
      const frag = document.createDocumentFragment();
      for (const row of slice) {
        const tr = document.createElement("tr");
        tr.innerHTML = COLUMNS.map((c) =>
          `<td class="${c.align || ""}">${cellHTML(c, row)}</td>`
        ).join("");
        frag.appendChild(tr);
      }
      body.replaceChildren(frag);
    }

    const end = Math.min(start + PAGE_SIZE, total);
    $("pageInfo").textContent = total
      ? `Showing ${(start + 1).toLocaleString()}–${end.toLocaleString()} of ${total.toLocaleString()} rows`
      : "No rows to show";
    $("pageNum").textContent = `Page ${state.page.toLocaleString()} / ${pages.toLocaleString()}`;

    $("first").disabled = $("prev").disabled = state.page <= 1;
    $("last").disabled  = $("next").disabled = state.page >= pages;

    renderStats();
  }

  function renderAll() {
    applyFilters();
    renderHead();   // keep the sort arrow / aria-sort in sync with state
    renderTable();
  }

  /* ========================== controls ========================= */

  function fillSelect(id, values) {
    const sel = $(id);
    const current = sel.value;
    sel.innerHTML = `<option value="">All</option>` +
      values.map((v) => `<option value="${esc(v)}">${esc(v === "" ? "—" : v)}</option>`).join("");
    sel.value = values.includes(current) ? current : "";
  }

  function populateFilters(rows) {
    const uniq = (key) => {
      const set = new Set();
      for (const r of rows) set.add(String(r[key] ?? ""));
      return [...set].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    };

    fillSelect("fClass",    uniq("class"));
    fillSelect("fGender",   uniq("gender"));
    fillSelect("fSurvived", uniq("survived").filter(Boolean));
    fillSelect("fEmbarked", uniq("embarked").filter(Boolean));
    fillSelect("fCountry",  uniq("country").filter(Boolean));
  }

  function wireControls() {
    let t = null;
    $("q").addEventListener("input", (e) => {
      clearTimeout(t);
      const v = e.target.value;
      t = setTimeout(() => {
        state.filters.q = v;
        state.page = 1;
        renderAll();
      }, 180);
    });

    const map = {
      fClass: "class", fGender: "gender", fSurvived: "survived",
      fEmbarked: "embarked", fCountry: "country"
    };
    for (const [id, key] of Object.entries(map)) {
      $(id).addEventListener("change", (e) => {
        state.filters[key] = e.target.value;
        state.page = 1;
        renderAll();
      });
    }

    $("headRow").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-sort]");
      if (!btn) return;
      const key = btn.dataset.sort;
      if (state.sortKey === key) {
        state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      } else {
        state.sortKey = key;
        state.sortDir = "asc";
      }
      state.page = 1;
      renderAll();
      scrollTop();
    });

    $("prev").addEventListener("click",  () => { state.page--; renderTable(); scrollTop(); });
    $("next").addEventListener("click",  () => { state.page++; renderTable(); scrollTop(); });
    $("first").addEventListener("click", () => { state.page = 1; renderTable(); scrollTop(); });
    $("last").addEventListener("click",  () => {
      state.page = Math.max(1, Math.ceil(state.view.length / PAGE_SIZE));
      renderTable(); scrollTop();
    });

    $("reset").addEventListener("click", () => {
      $("q").value = "";
      ["fClass", "fGender", "fSurvived", "fEmbarked", "fCountry"].forEach((id) => { $(id).value = ""; });
      state.filters = { q: "", class: "", gender: "", survived: "", embarked: "", country: "" };
      state.page = 1;
      renderAll();
    });

    $("reload").addEventListener("click", () => start());
  }

  function scrollTop() {
    const el = document.querySelector(".table-scroll");
    if (el) el.scrollTop = 0;
  }

  function showError(err) {
    setStatus("Connection failed", "err");
    $("tableBox").hidden = true;
    $("stats").hidden = true;
    $("controls").hidden = true;

    const box = $("stateBox");
    box.hidden = false;
    box.innerHTML =
      `<h2>Could not load the table</h2>` +
      `<p>${esc(err && err.message ? err.message : String(err))}</p>` +
      `<pre>${esc([
        "table     : " + TABLE,
        "url       : " + SUPABASE_URL,
        err && err.code    ? "code      : " + err.code    : "",
        err && err.details ? "details   : " + err.details : "",
        err && err.hint    ? "hint      : " + err.hint    : ""
      ].filter(Boolean).join("\n"))}</pre>` +
      `<p style="margin-top:14px">Check that the table exists, that RLS allows anonymous reads, ` +
      `and that this page can reach the network.</p>`;
  }

  /* =========================== bootstrap ======================= */

  async function start() {
    $("reload").disabled = true;
    $("stateBox").hidden = false;
    $("stateBox").innerHTML =
      `<h2>Loading passenger records…</h2>
       <p id="prog">Fetching rows from the Supabase REST API.</p>
       <div class="bar"><i></i></div>`;
    $("tableBox").hidden = true;
    $("stats").hidden = true;
    $("controls").hidden = true;
    setStatus("Loading…", "load");

    try {
      if (!window.supabase || typeof window.supabase.createClient !== "function") {
        throw new Error("supabase-js failed to load from the CDN. Check your internet connection.");
      }

      const rows = await loadAllRows((n) => {
        const p = $("prog");
        if (p) p.textContent = `Fetched ${n.toLocaleString()} rows…`;
      });

      if (!rows.length) {
        setStatus("Table is empty", "");
        $("stateBox").innerHTML =
          `<h2>Connected — but the table is empty</h2>
           <p>The request succeeded and returned 0 rows from <code>${esc(TABLE)}</code>.</p>`;
        return;
      }

      state.rows = rows;
      state.view = rows.slice();
      state.page = 1;

      populateFilters(rows);
      renderHead();
      renderAll();

      $("stateBox").hidden = true;
      $("tableBox").hidden = false;
      $("stats").hidden = false;
      $("controls").hidden = false;
      setStatus(`Connected · ${rows.length.toLocaleString()} rows`, "live");
    } catch (err) {
      console.error(err);
      showError(err);
    } finally {
      $("reload").disabled = false;
    }
  }

  wireControls();
  start();
})();
</script>
</body>
</html>
